name: Windows build and release
on:
  push:
    branches: [pdf-view-office-settings-0.4.0]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified PDFium
        run: python scripts/fetch_pdfium.py
      - name: Configure and build Windows x64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-ci | Out-Null
          cmake -S . -B build-ci -A x64 *> build-ci/configure.log
          $configureExit = $LASTEXITCODE
          Get-Content build-ci/configure.log
          if ($configureExit -ne 0) {
            @('### CMake diagnostics', '```text') + (Get-Content build-ci/configure.log -Tail 120) + @('```') | Add-Content $env:GITHUB_STEP_SUMMARY
            exit $configureExit
          }
          cmake --build build-ci --config Release --parallel 4 *> build-ci/build.log
          $buildExit = $LASTEXITCODE
          Get-Content build-ci/build.log
          if ($buildExit -ne 0) {
            @('### Windows compiler diagnostics', '```text') + (Get-Content build-ci/build.log -Tail 160) + @('```') | Add-Content $env:GITHUB_STEP_SUMMARY
            exit $buildExit
          }
      - name: Report Windows compiler errors
        if: failure()
        shell: pwsh
        run: |
          $messages = Get-ChildItem build-ci/*.log -ErrorAction SilentlyContinue | Select-String -Pattern 'error C[0-9]+|error LNK[0-9]+|fatal error|CMake Error|error RC[0-9]+' | Select-Object -First 15
          foreach ($message in $messages) {
            $text = $message.Line.Replace('%', '%25').Replace([string][char]13, '%0D').Replace([string][char]10, '%0A')
            Write-Output "::error::$text"
          }
      - name: Core, settings and native page renderer regression checks
        run: ctest --test-dir build-ci -C Release --output-on-failure --timeout 60
      - name: Exercise bundled Windows PDF engine
        shell: pwsh
        run: |
          Copy-Item vendor/pdfium/pypdfium2_raw/pdfium.dll build-ci/Release/pdfium.dll
          python tests/make_release_pdf.py build-ci/fixture.pdf
          $exe = (Resolve-Path build-ci/Release/PaperView.exe).Path
          $inputPdf = (Resolve-Path build-ci/fixture.pdf).Path
          $outputDir = Join-Path (Resolve-Path build-ci).Path 'pdf-smoke'
          $process = Start-Process -FilePath $exe -ArgumentList @('--self-test', $inputPdf, $outputDir) -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Bundled PDF engine self-test failed" }
          Get-Content build-ci/pdf-smoke/report.txt
      - name: Package installer and portable build
        shell: pwsh
        run: |
          try {
            New-Item -ItemType Directory -Force build-ci/package, artifacts | Out-Null
            Copy-Item build-ci/Release/PaperView.exe build-ci/package/
            Copy-Item vendor/pdfium/pypdfium2_raw/pdfium.dll build-ci/package/
            Copy-Item -Recurse vendor/pdfium/pypdfium2-5.14.0.dist-info/licenses build-ci/package/ThirdPartyLicenses
            Copy-Item docs/USER_GUIDE.zh-CN.md build-ci/package/使用说明.txt
            Copy-Item docs/THIRD_PARTY.md build-ci/package/THIRD_PARTY.txt
            Copy-Item packaging/TutorialFonts.txt build-ci/package/TutorialFonts.txt
            $candidates = @("${env:ProgramFiles(x86)}/NSIS/makensis.exe", "$env:ProgramFiles/NSIS/makensis.exe", "$env:ChocolateyInstall/bin/makensis.exe")
            $nsis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (!$nsis) {
              choco install nsis -y --no-progress
              if ($LASTEXITCODE -notin 0,3010) { throw "NSIS installation failed" }
              $nsis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            }
            if (!$nsis) { throw "makensis.exe was not found after installing NSIS" }
            $payload = (Resolve-Path build-ci/package).Path
            $output = Join-Path (Resolve-Path artifacts).Path 'PDF-view-Setup-0.4.1-x64.exe'
            & $nsis /INPUTCHARSET UTF8 /V3 "/DPAYLOAD=$payload" "/DOUTPUT=$output" packaging/installer.nsi *> artifacts/nsis.log
            if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
            Compress-Archive -Path build-ci/package/* -DestinationPath artifacts/PDF-view-0.4.1-x64-portable.zip
            $sums = Get-ChildItem artifacts -File | Where-Object Extension -in '.exe','.zip' | ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
            $sums | Set-Content artifacts/SHA256SUMS.txt -Encoding utf8
          } catch {
            $errorText = $_.Exception.Message.Replace('%', '%25').Replace([string][char]13, '%0D').Replace([string][char]10, '%0A')
            Write-Output "::error::$errorText"
            if (Test-Path artifacts/nsis.log) {
              Get-Content artifacts/nsis.log -Tail 16 | ForEach-Object { Write-Output "::error::$($_.Replace('%','%25'))" }
            }
            throw
          }
      - name: Open the settings tutorial and capture three real practice pages
        shell: pwsh
        run: |
          $exe = (Resolve-Path build-ci/Release/PaperView.exe).Path
          $app = Start-Process -FilePath $exe -PassThru
          & build-ci/Release/tutorial_ui_driver.exe
          $result = $LASTEXITCODE
          if (!$app.HasExited) { Stop-Process -Id $app.Id -ErrorAction SilentlyContinue }
          if ($result -ne 0) { throw "Settings tutorial UI check failed ($result)" }
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-view-Windows-x64
          path: artifacts/*
      - name: Publish GitHub Release with setup
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "$env:GITHUB_REF_NAME" artifacts/PDF-view-Setup-0.4.1-x64.exe artifacts/PDF-view-0.4.1-x64-portable.zip artifacts/SHA256SUMS.txt artifacts/01-math.png artifacts/02-physics.png artifacts/03-chemistry.png --title "PDF view $env:GITHUB_REF_NAME" --notes-file docs/RELEASE-0.4.1.zh-CN.md --verify-tag
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publication failed" }
